services:
  postgres:
    image: postgres:16-alpine
    container_name: bazar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 180905
      POSTGRES_DB: Bazar
    ports:
      - "5432:5432"
    volumes:
      - bazar_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  bazar_pgdata:
